databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack

services:
  - type: web
    name: fintrack-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
