services:
  - type: web
    name: fintrack-api
    runtime: docker
    rootDir: backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        fromService:
          name: fintrack-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        value: Demo@12345

  - type: web
    name: fintrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          name: fintrack-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
